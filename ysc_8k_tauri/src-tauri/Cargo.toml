[package]
name = "ysc_8k_desktop"
version = "2.1.0"
edition = "2021"
rust-version = "1.82"
description = "YSC 8K 纯 Rust Tauri 单 exe 驱动"

[lib]
name = "ysc_8k_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sha2 = "0.10"
ysc_core = { path = "../../ysc_8k_driver_rs/crates/ysc_core" }
ysc_host = { path = "../../ysc_8k_driver_rs/crates/ysc_host" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media",
  "Win32_Networking_WinSock",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
